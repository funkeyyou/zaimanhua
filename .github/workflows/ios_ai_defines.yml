name: ios-ai-defines
# 臨時用途：把 ZAI_AI_CONFIG 轉成 dart-define 檔，並用呼叫者提供的公鑰加密後上傳，
# 讓本機建置 TestFlight 版時也能注入 AI 設定。產物只有持有私鑰的人能解開。
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Base64 編碼的 RSA 公鑰（PEM）"
        required: true

jobs:
  defines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Make and encrypt defines
        shell: bash
        env:
          ZAI_AI_CONFIG: ${{ secrets.ZAI_AI_CONFIG }}
          PUBKEY_B64: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/enc"
          mkdir -p "$out"
          dart run tools/ai/make_ai_defines.dart --env ZAI_AI_CONFIG --out "$RUNNER_TEMP/ai_defines.json"
          printf '%s' "$PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/pub.pem"
          openssl rand -out "$RUNNER_TEMP/k.bin" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/ai_defines.json" -out "$out/defines.enc" -pass file:"$RUNNER_TEMP/k.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.bin" -out "$out/key.enc"
          rm -f "$RUNNER_TEMP/ai_defines.json" "$RUNNER_TEMP/k.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: ai-defines-encrypted
          path: ${{ runner.temp }}/enc
          retention-days: 1
