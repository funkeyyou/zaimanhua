name: build-release
# 手動觸發（workflow_dispatch）出測試包；推 v* tag 時自動建立 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true
      - name: Restore packages
        run: flutter pub get
      # 沒有 zai_key.properties 時 gradle 會自動退回 debug 簽名，無需任何 secrets
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ZAI-X-android.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ZAI-X-android.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZAI-X-android.apk

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "ZAI-X-windows-x64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ZAI-X-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZAI-X-windows-x64.zip
