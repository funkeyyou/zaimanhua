name: build-release
# 手動觸發（workflow_dispatch）出測試包；推 v* tag 時自動建立 GitHub Release
# 單一產物內建簡/繁切換（設定→界面语言；預設跟隨系統）
# Flutter 版本固定 3.47.2（本機與 CI 需一致）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Restore packages
        run: flutter pub get
      # info 級別的 lint 不擋（目前有 13 條既有項目），error/warning 才擋
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ZAI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Restore packages
        run: flutter pub get
      # 設定了 ZAI_KEYSTORE_BASE64 等 secrets 時使用正式簽名；否則 gradle 自動退回 debug 簽名
      - name: Restore keystore (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        shell: bash
        run: |
          printf '%s' "${{ secrets.ZAI_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -di > "$RUNNER_TEMP/zaimanhua-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/zaimanhua-release.jks"
            echo "storePassword=${{ secrets.ZAI_STORE_PASSWORD }}" | tr -d '\r'
            echo "keyPassword=${{ secrets.ZAI_KEY_PASSWORD }}" | tr -d '\r'
            echo "keyAlias=${{ secrets.ZAI_KEY_ALIAS }}" | tr -d '\r'
          } > android/zai_key.properties
      # 打包前换成 comic-index 分支上每天更新的本地漫画索引；取不到或不完整就沿用仓库内的快照
      - name: Refresh bundled comic index
        shell: bash
        run: |
          if git fetch --depth=1 origin comic-index 2>/dev/null; then
            tmp="$RUNNER_TEMP/comic-index"
            mkdir -p "$tmp"
            git show FETCH_HEAD:comic_index.tsv.gz > "$tmp/comic_index.tsv.gz"
            git show FETCH_HEAD:comic_index.json > "$tmp/comic_index.json"
            lines=$(gzip -dc "$tmp/comic_index.tsv.gz" | tail -n +2 | grep -c . || true)
            count=$(sed -n 's/.*"count": *\([0-9]*\).*/\1/p' "$tmp/comic_index.json")
            if [ -n "$count" ] && [ "$lines" = "$count" ]; then
              cp "$tmp/comic_index.tsv.gz" "$tmp/comic_index.json" assets/comic_index/
              echo "已换成 comic-index 分支的索引（$count 部）"
            else
              echo "comic-index 分支的索引不完整，沿用仓库内的快照"
            fi
          else
            echo "没有 comic-index 分支，沿用仓库内的快照"
          fi
      # AI 搜索的服务设定存在 secrets（仓库里没有明文），混淆后以 dart-define 注入；没设定时 App 隐藏 AI 功能
      - name: Prepare AI defines
        shell: bash
        env:
          ZAI_AI_CONFIG: ${{ secrets.ZAI_AI_CONFIG }}
        run: dart run tools/ai/make_ai_defines.dart --env ZAI_AI_CONFIG --out "$RUNNER_TEMP/ai_defines.json"
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file="${{ runner.temp }}/ai_defines.json"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ZAI-X-android.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ZAI-X-android.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" ZAI-X-android.apk --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    # 曾因 permission_handler_windows 0.2.1 的 <experimental/coroutine> 在 VS2026 STL 報 STL1011
    # 而鎖在 windows-2022；0.2.2 已移除該標頭，改回追隨最新映像
    runs-on: windows-latest
    needs: analyze
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Restore packages
        run: flutter pub get
      # 打包前换成 comic-index 分支上每天更新的本地漫画索引；取不到或不完整就沿用仓库内的快照
      - name: Refresh bundled comic index
        shell: bash
        run: |
          if git fetch --depth=1 origin comic-index 2>/dev/null; then
            tmp="$RUNNER_TEMP/comic-index"
            mkdir -p "$tmp"
            git show FETCH_HEAD:comic_index.tsv.gz > "$tmp/comic_index.tsv.gz"
            git show FETCH_HEAD:comic_index.json > "$tmp/comic_index.json"
            lines=$(gzip -dc "$tmp/comic_index.tsv.gz" | tail -n +2 | grep -c . || true)
            count=$(sed -n 's/.*"count": *\([0-9]*\).*/\1/p' "$tmp/comic_index.json")
            if [ -n "$count" ] && [ "$lines" = "$count" ]; then
              cp "$tmp/comic_index.tsv.gz" "$tmp/comic_index.json" assets/comic_index/
              echo "已换成 comic-index 分支的索引（$count 部）"
            else
              echo "comic-index 分支的索引不完整，沿用仓库内的快照"
            fi
          else
            echo "没有 comic-index 分支，沿用仓库内的快照"
          fi
      # AI 搜索的服务设定存在 secrets（仓库里没有明文），混淆后以 dart-define 注入；没设定时 App 隐藏 AI 功能
      - name: Prepare AI defines
        shell: bash
        env:
          ZAI_AI_CONFIG: ${{ secrets.ZAI_AI_CONFIG }}
        run: dart run tools/ai/make_ai_defines.dart --env ZAI_AI_CONFIG --out "$RUNNER_TEMP/ai_defines.json"
      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file="${{ runner.temp }}/ai_defines.json"
      - name: Zip
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "ZAI-X-windows-x64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: ZAI-X-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" ZAI-X-windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-ios:
    # 不簽名的 IPA：用 AltStore / SideStore / Sideloadly 以自己的 Apple ID 重新簽名後安裝
    runs-on: macos-latest
    needs: analyze
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Restore packages
        run: flutter pub get
      # 打包前换成 comic-index 分支上每天更新的本地漫画索引；取不到或不完整就沿用仓库内的快照
      - name: Refresh bundled comic index
        shell: bash
        run: |
          if git fetch --depth=1 origin comic-index 2>/dev/null; then
            tmp="$RUNNER_TEMP/comic-index"
            mkdir -p "$tmp"
            git show FETCH_HEAD:comic_index.tsv.gz > "$tmp/comic_index.tsv.gz"
            git show FETCH_HEAD:comic_index.json > "$tmp/comic_index.json"
            lines=$(gzip -dc "$tmp/comic_index.tsv.gz" | tail -n +2 | grep -c . || true)
            count=$(sed -n 's/.*"count": *\([0-9]*\).*/\1/p' "$tmp/comic_index.json")
            if [ -n "$count" ] && [ "$lines" = "$count" ]; then
              cp "$tmp/comic_index.tsv.gz" "$tmp/comic_index.json" assets/comic_index/
              echo "已换成 comic-index 分支的索引（$count 部）"
            else
              echo "comic-index 分支的索引不完整，沿用仓库内的快照"
            fi
          else
            echo "没有 comic-index 分支，沿用仓库内的快照"
          fi
      - name: Prepare AI defines
        shell: bash
        env:
          ZAI_AI_CONFIG: ${{ secrets.ZAI_AI_CONFIG }}
        run: dart run tools/ai/make_ai_defines.dart --env ZAI_AI_CONFIG --out "$RUNNER_TEMP/ai_defines.json"
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file="${{ runner.temp }}/ai_defines.json"
      - name: Package IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ZAI-X-ios-unsigned.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ZAI-X-ios-unsigned.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" ZAI-X-ios-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
