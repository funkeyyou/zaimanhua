name: build-release
# 手動觸發（workflow_dispatch）出測試包；推 v* tag 時自動建立 GitHub Release
# 矩陣同時產出簡體（sc）與繁體（tc）兩種語言版本；繁體為建置期 OpenCC s2twp 轉換
# Flutter 版本依 pubspec.lock（3.38.x）；勿改回 3.22
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        lang: [sc, tc]
    env:
      HAS_KEYSTORE: ${{ secrets.ZAI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true
      - name: Convert UI to Traditional Chinese
        if: ${{ matrix.lang == 'tc' }}
        run: |
          pip install --quiet opencc-python-reimplemented
          python tools/s2twp/convert.py
      - name: Restore packages
        run: flutter pub get
      # 設定了 ZAI_KEYSTORE_BASE64 等 secrets 時使用正式簽名；否則 gradle 自動退回 debug 簽名
      - name: Restore keystore (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        shell: bash
        run: |
          printf '%s' "${{ secrets.ZAI_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -di > "$RUNNER_TEMP/zaimanhua-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/zaimanhua-release.jks"
            echo "storePassword=${{ secrets.ZAI_STORE_PASSWORD }}" | tr -d '\r'
            echo "keyPassword=${{ secrets.ZAI_KEY_PASSWORD }}" | tr -d '\r'
            echo "keyAlias=${{ secrets.ZAI_KEY_ALIAS }}" | tr -d '\r'
          } > android/zai_key.properties
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ZAI-X-android-${{ matrix.lang }}.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.lang }}
          path: ZAI-X-android-${{ matrix.lang }}.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZAI-X-android-${{ matrix.lang }}.apk

  build-windows:
    # windows-latest 已是 VS2026，其 STL 對 <experimental/coroutine> 直接報錯（STL1011），
    # permission_handler_windows 0.2.1 尚未跟進；VS2022 工具鏈可正常編譯
    runs-on: windows-2022
    permissions:
      contents: write
    strategy:
      matrix:
        lang: [sc, tc]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true
      - name: Convert UI to Traditional Chinese
        if: ${{ matrix.lang == 'tc' }}
        run: |
          pip install --quiet opencc-python-reimplemented
          python tools/s2twp/convert.py
      - name: Restore packages
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "ZAI-X-windows-x64-${{ matrix.lang }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-${{ matrix.lang }}
          path: ZAI-X-windows-x64-${{ matrix.lang }}.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZAI-X-windows-x64-${{ matrix.lang }}.zip
